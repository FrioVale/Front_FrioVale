
name: Azure Static Web Apps CI/CD

on:
  workflow_dispatch:

  push:

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  build_job:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Salvar build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/

  deploy_job:
    name: Deploy no Azure
    needs: build_job
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Baixar build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Publicar no Azure
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_STONE_06CFA9910 }}
          action: "upload"
          app_location: "dist"
          api_location: ""
          output_location: ""
          skip_app_build: true
